<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Underwater subwoofer</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>
<main>
    <div class="carrousel">
        <div>
            <button name="prev" id="prev-button" onclick="CarrouselHandler('prev')">
                <i data-lucide="CircleArrowLeft"></i>
            </button>
            <iframe data-testid="embed-iframe" id="playlist-iframe" style="border-radius:12px"
                    src=""
                    width="100%" height="352" allowfullscreen=""
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"></iframe>
            <button name="next" id="next-button" onclick="CarrouselHandler('next')">
                <i data-lucide="CircleArrowRight"></i>
            </button>
        </div>
        <div>
            <span id="current-item">1</span>
            <p>/</p>
            <span class="carrousel-numbering">
            </span>
        </div>
    </div>
</main>
</body>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="index.js" lang="javascript"></script>
</html>
